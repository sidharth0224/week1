version: "3.8"

services:
  app:
    build: .
    container_name: inventory-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_FILE=inventory.db
      - JWT_SECRET=super-secret-jwt-key-change-me-in-production
    volumes:
      - db-data:/app
    restart: unless-stopped

volumes:
  db-data:
